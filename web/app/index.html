<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // The extension trusts https://bitchord.in only (web/extension/site.config.ts),
      // so www goes there before anything loads, keeping its path and query.
      if (location.hostname === 'www.bitchord.in') location.replace('https://bitchord.in' + location.pathname + location.search + location.hash);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        if (s === 'light' || s === 'dark') document.querySelector('meta[name="color-scheme"]').content = s;
        var p = localStorage.getItem('isopod:theme-preset');
        if (p) document.documentElement.dataset.theme = p;
        var u = localStorage.getItem('isopod:ui-mode');
        if (u === 'primary' || u === 'secondary' || u === 'editorial' || u === 'bento') document.documentElement.dataset.uiMode = u;
        var bp = localStorage.getItem('isopod:brutal-palette');
        if (bp) document.documentElement.dataset.brutalPalette = bp;
        if (bp === 'custom') {
          var b1 = localStorage.getItem('isopod:brutal-primary');
          var b2 = localStorage.getItem('isopod:brutal-secondary');
          if (b1) document.documentElement.style.setProperty('--brutal-custom-accent', b1);
          if (b2) document.documentElement.style.setProperty('--brutal-custom-accent-2', b2);
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f1f1f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ISO pod" />
    <title>ISO pod — Pure Sound. Pocket Hi-Fi.</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- DM Sans is the app's typeface (web/docs/apple-music-dom.md, "Font"). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..800;1,9..40,400..800&family=Playfair+Display:wght@700;900&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
